name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing (OIDC) needs npm >= 11.5.1
      - run: npm install -g npm@latest
      - run: npm ci
      - name: Verify tag matches package.json version
        run: |
          PKG_V=$(node -p "require('./package.json').version")
          test "v$PKG_V" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != package version $PKG_V"; exit 1; }
      - run: npm run lint
      - run: npm test
      - run: npm run package
      # Auth via npm Trusted Publishing (OIDC); no token needed.
      # Provenance is automatic with trusted publishing; flag kept for clarity.
      - run: npm publish --provenance --access public
